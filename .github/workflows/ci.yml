name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Code Validation & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python Syntax & Merge Conflicts
        run: |
          python -m compileall -q -f .
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " . ; then
            echo "Found merge conflicts!"
            exit 1
          fi
          echo "All Python code compiled cleanly with no conflicts."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: react-ui/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: react-ui
        run: npm ci || npm install

      - name: Build Frontend Application
        working-directory: react-ui
        run: npm run build

      - name: Verify Seed Scripts
        run: |
          python -c "import py_compile; py_compile.compile('seed_real_payroll.py', doraise=True); print('seed_real_payroll.py is valid!')"
