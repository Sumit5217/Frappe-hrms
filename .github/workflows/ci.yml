name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Statutory Payroll Unit Tests & Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Statutory Payroll & TDS Unit Tests
        run: |
          python hrms/tests/test_statutory_payroll.py

      - name: Verify Python Scripts
        run: |
          python -m py_compile seed_real_payroll.py seed_alpha_employees.py seed_employees.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: react-ui
        run: npm install

      - name: Build Frontend Application
        working-directory: react-ui
        run: npm run build
